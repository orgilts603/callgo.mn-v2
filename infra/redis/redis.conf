# =============================================================================
# CallGo.mn — Redis 7 configuration (LiveKit message bus + SIP/room state)
# Redis: LiveKit-ийн дотоод мессежийн шугам ба төлөв хадгалагч
#
# Redis is only reachable on the private Docker network (the compose file
# publishes it on 127.0.0.1 for local debugging at most). If you ever expose
# it, set `requirepass` and give the password to livekit, livekit-sip and
# egress (their `redis.password` keys).
# =============================================================================
bind 0.0.0.0
port 6379
protected-mode no

# Persistence: AOF (fsync every second) + periodic RDB snapshots in /data
# (the `redis-data` named volume). Хадгалалт: /data хавтас.
dir /data
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# LiveKit keeps routing / room / SIP state here; never evict it silently.
maxmemory-policy noeviction

# Close idle client connections after 5 minutes; send TCP keepalives.
timeout 300
tcp-keepalive 60

loglevel notice
