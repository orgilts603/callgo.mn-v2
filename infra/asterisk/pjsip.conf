; =============================================================================
; CallGo.mn — Asterisk PJSIP configuration (template)
; Asterisk PJSIP тохиргоо (загвар)
;
; RENDERING: infra/asterisk/render-config.sh copies every *.conf from this
; directory into /etc/asterisk at container start and substitutes ONLY the
; allow-listed ${VARIABLES} below (envsubst). Dialplan variables such as
; ${EXTEN} are left untouched. Values come from .env via docker compose.
;   SIP_EXTERNAL_IP     public IPv4 of the VPS (carrier-facing Contact/SDP)
;   SIP_LOCAL_NET       Docker network CIDR (no NAT rewriting towards it)
;   LIVEKIT_SIP_HOST    livekit-sip container IP (static, 172.28.0.11)
;   LIVEKIT_SIP_PORT    livekit-sip SIP port (5060)
;   SIP_AUTH_USERNAME / SIP_AUTH_PASSWORD   shared secret Asterisk <-> livekit-sip
;   CARRIER_*           carrier trunk (see the carrier section)
; (Зөвхөн жагсаасан хувьсагчдыг орлуулна; ${EXTEN} мэтийг хөндөхгүй.)
;
; Call path (Дуудлагын зам):
;   Carrier --[carrier endpoint]--> Asterisk --[livekit endpoint]--> livekit-sip
; See docs/ASTERISK.md and docs/SIP_FLOW.md.
; =============================================================================

; -----------------------------------------------------------------------------
; Global settings / Ерөнхий тохиргоо
; -----------------------------------------------------------------------------
[global]
type=global
user_agent=CallGo-PBX
; Identify peers by source IP first (carrier signalling IPs, livekit-sip),
; then by auth username (the optional test softphone). There is NO anonymous
; endpoint: INVITEs from unknown sources are rejected.
endpoint_identifier_order=ip,username
; Security log: count requests from unidentified sources (SIP scanners) and
; report them to security.log, which fail2ban can watch.
; (Танигдаагүй эх үүсвэрийн хүсэлтийг security.log-д бүртгэнэ.)
unidentified_request_count=5
unidentified_request_period=5
unidentified_request_prune_interval=30

; -----------------------------------------------------------------------------
; Transport / Тээврийн давхарга (UDP 5060)
; Asterisk runs on a Docker bridge network; docker publishes 5060/udp and the
; RTP range to the host. external_* addresses are written into SIP headers and
; SDP for every peer OUTSIDE local_net (i.e. the carrier). Peers inside
; local_net (livekit-sip on the Docker network) see the container IP.
; -----------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_signaling_address=${SIP_EXTERNAL_IP}
external_media_address=${SIP_EXTERNAL_IP}
local_net=${SIP_LOCAL_NET}
local_net=127.0.0.1/32
; DiffServ marking for voice signalling (many carrier links honour it).
tos=cs3
cos=3

; =============================================================================
; LiveKit SIP side / LiveKit SIP тал
; Inbound PSTN calls are forwarded here: Dial(PJSIP/<E.164 DID>@livekit).
; livekit-sip sends outbound (campaign) calls to Asterisk from this peer and
; lands in context [from-livekit].
; =============================================================================

; Where livekit-sip lives. qualify keeps an eye on it (`pjsip show aors`).
[livekit]
type=aor
contact=sip:${LIVEKIT_SIP_HOST}:${LIVEKIT_SIP_PORT}
qualify_frequency=30
qualify_timeout=3.0

; Shared credentials. livekit-sip must answer Asterisk's digest challenge with
; them on outbound calls (LiveKit outbound trunk auth_username/auth_password =
; SIP_AUTH_USERNAME/SIP_AUTH_PASSWORD, set by the backend or lk-setup.sh).
; The same pair is offered if livekit-sip ever challenges Asterisk (inbound
; trunk auth — CallGo relies on the IP allow-list there by default).
[livekit-auth]
type=auth
auth_type=userpass
username=${SIP_AUTH_USERNAME}
password=${SIP_AUTH_PASSWORD}

[livekit]
type=endpoint
transport=transport-udp
context=from-livekit
aors=livekit
; Challenge INVITEs coming from livekit-sip (defence in depth on top of the
; IP match below).
auth=livekit-auth
; Answer a challenge from livekit-sip if its inbound trunk requires auth.
outbound_auth=livekit-auth
; Codecs: livekit-sip speaks PCMA/PCMU/G.722 (no Opus on the SIP leg).
; Listing the carrier's G.711 flavour first avoids transcoding entirely.
; Opus is not useful here: livekit-sip does not offer it over SIP.
; (Кодек: G.711 A-law эхэнд — хөрвүүлэлтгүй дамжуулна.)
disallow=all
allow=alaw,ulaw,g722
; Media always flows through Asterisk (needed for recording / NAT fixing).
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; DTMF: RFC 4733 telephone-events on both legs = transparent passthrough, the
; agent receives digits as LiveKit SIP DTMF events. (DTMF шууд дамжина.)
dtmf_mode=rfc4733
; Preserve caller identity (P-Asserted-Identity) end to end.
send_pai=yes
trust_id_inbound=yes
trust_id_outbound=yes
; Tear down calls whose media died (container restart, network loss).
rtp_timeout=60
rtp_timeout_hold=600
; Session timers keep long AI calls alive through stateful middleboxes.
timers=yes
timers_sess_expires=1800
language=en

[livekit]
type=identify
endpoint=livekit
match=${LIVEKIT_SIP_HOST}

; =============================================================================
; Optional pieces, rendered by render-config.sh only when enabled in .env
; (render-config.sh writes an empty file otherwise):
;   pjsip_carrier.conf               carrier trunk      (CARRIER_HOST set)
;   pjsip_carrier_registration.conf  carrier REGISTER   (CARRIER_REGISTER=yes)
;   pjsip_testphone.conf             test softphone     (TEST_PHONE_PASSWORD set)
; (Нөхцөлтэй хэсгүүд: .env-д идэвхжүүлсэн үед л үүснэ.)
; =============================================================================
#tryinclude pjsip_carrier.conf
#tryinclude pjsip_carrier_registration.conf
#tryinclude pjsip_testphone.conf
