; =============================================================================
; CallGo.mn — Asterisk core settings / Asterisk-ийн үндсэн тохиргоо
;
; Same directory layout as the andrius/asterisk image, except astdbdir: the
; AstDB (per-number trunk overrides `callgo-endpoint/<E.164>`, see
; docs/ASTERISK.md §4) lives on the persistent `asterisk-spool` volume so it
; survives container re-creation.
; =============================================================================
; No "(!)" suffix: with it the category is a template and these paths are ignored.
[directories]
astcachedir => /var/cache/asterisk
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/spool/asterisk/astdb
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
verbose = 3
; Keep sending (comfort) silence while nobody speaks: keeps NAT pinholes and
; carrier RTP-timeout timers happy during long AI "thinking" pauses.
transmit_silence = yes
