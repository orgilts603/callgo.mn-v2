; =============================================================================
; CallGo.mn — Asterisk logging / Логийн тохиргоо
;
; `docker compose logs -f asterisk` shows the console channel. Files go to
; /var/log/asterisk (the `asterisk-log` volume).
; security.log is what fail2ban (asterisk jail) should watch.
; For SIP traces: asterisk -rx "pjsip set logger on" (see docs/ASTERISK.md).
; =============================================================================
[general]
dateformat=%F %T.%3q
; Tag every line with the call-id so one call can be grepped end to end.
use_callids=yes
appendhostname=no

[logfiles]
console => notice,warning,error,verbose(3)
messages.log => notice,warning,error,verbose(3)
security.log => security
; Uncomment temporarily for deep debugging (grows fast):
; full.log => notice,warning,error,debug,verbose,dtmf
