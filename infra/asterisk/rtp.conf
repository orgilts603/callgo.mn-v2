; =============================================================================
; CallGo.mn — Asterisk RTP settings / RTP медиа портын тохиргоо
;
; Media ports Asterisk uses towards BOTH the carrier and livekit-sip.
; infra/docker-compose.yml publishes exactly this range (10000-10200/udp) on
; the host, and the firewall must allow it from the carrier's media IPs.
; 201 ports = ~100 simultaneous calls (each call uses two RTP ports: carrier
; leg + livekit leg; RTCP is multiplexed onto the next odd port).
; To grow: widen rtpstart/rtpend AND the compose port mapping together.
; (Портын мужийг өөрчилбөл docker-compose.yml-ийг хамт өөрчил.)
; =============================================================================
[general]
rtpstart=10000
rtpend=10200
; Learn the peer's real media address from the first packets (NAT safety)
; and drop RTP from anyone else afterwards.
strictrtp=yes
probation=4
; No ICE/STUN/TURN needed: carrier and livekit-sip are plain SIP peers.
icesupport=no
; RFC 4733 DTMF end-event timeout (ms) — keeps digits reliable for the agent.
dtmftimeout=3000
