; =============================================================================
; CallGo.mn — Asterisk dialplan (template)
; Asterisk-ийн дуудлагын маршрут (dialplan)
;
; Only the ${ENV_VARIABLES} used in [globals] are substituted at container
; start (render-config.sh allow-list); every other ${...} is dialplan syntax.
;
; Contexts / Контекстууд:
;   [from-carrier]    PSTN -> Asterisk -> livekit-sip  (inbound, AI answers)
;   [from-livekit]    livekit-sip -> Asterisk -> PSTN  (outbound campaigns / tests)
;   [from-testphone]  optional softphone that simulates an inbound PSTN call
; Number format inside CallGo is always E.164 (+97677001234): LiveKit inbound
; trunks, CRM SIP numbers and contacts all use it, so every leg entering or
; leaving the carrier is normalised here.
; (CallGo дотор дугаар бүр E.164 хэлбэртэй: +976XXXXXXXX)
; =============================================================================

[general]
static=yes
writeprotect=yes
; Unknown extensions get a clean hangup instead of falling through.
autofallthrough=yes
clearglobalvars=no

[globals]
; Mongolia: country code 976, 8-digit national significant numbers, no trunk
; prefix, "00" international prefix. (Монгол: улсын код 976, 8 оронтой дугаар.)
COUNTRY_CODE=976
NATIONAL_LEN=8
; Where the called DID is read from on inbound calls:
;   ruri = Request-URI user (typical for IP-authenticated trunks)
;   to   = To header user (typical for registration trunks, whose INVITEs are
;          addressed to the registered username)
DID_SOURCE=${CARRIER_DID_SOURCE}
; Fallback DID when the carrier only sends the trunk username (single-DID
; trunks). E.164.
DEFAULT_DID=${CARRIER_DEFAULT_DID}
; How the carrier wants numbers on outbound calls: e164 (+97677001234),
; intl (97677001234) or national (77001234; foreign numbers get 00 prefix).
CARRIER_FORMAT=${CARRIER_NUMBER_FORMAT}
; Record every call leg with MixMonitor into /var/spool/asterisk/monitor
; (yes/no). LiveKit egress recording (docker compose profile "recording") is
; the recording the CRM shows; this is an optional PBX-side archive.
RECORD_CALLS=${ASTERISK_RECORD_CALLS}
; Ring timeouts (seconds).
INBOUND_RING_TIMEOUT=45
OUTBOUND_RING_TIMEOUT=60

; -----------------------------------------------------------------------------
; Inbound: carrier -> LiveKit / Орж ирэх дуудлага
; The carrier's INVITE lands here (endpoint `carrier`, context from-carrier).
; We normalise the DID and the caller ID to E.164 and hand the call to
; livekit-sip, whose inbound trunk (numbers = [DID]) + dispatch rule create a
; room "call_<caller>_<random>" and dispatch the `callgo` agent.
; Caller ID is preserved (From / P-Asserted-Identity); DTMF passes through as
; RFC 4733; Asterisk does NOT answer — livekit-sip's 200 OK is relayed, so
; the carrier starts billing only when the AI actually picks up.
; -----------------------------------------------------------------------------
[from-carrier]
exten => _[+0-9a-zA-Z].,1,NoOp(CallGo inbound: ruri=${EXTEN} to=${PJSIP_HEADER(read,To)} cli=${CALLERID(num)})
 same => n,Set(DID=${EXTEN})
 same => n,GotoIf($["${DID_SOURCE}" != "to"]?gotdid)
 ; To: "Name" <sip:77001234@carrier;user=phone>  ->  77001234
 same => n,Set(TOHDR=${PJSIP_HEADER(read,To)})
 same => n,Set(TOUSER=${CUT(TOHDR,@,1)})
 same => n,Set(DID=${CUT(TOUSER,:,2)})
 ; Registration trunks may address the INVITE to the trunk username only:
 ; anything that is not a phone number falls back to DEFAULT_DID.
 same => n(gotdid),ExecIf($["${FILTER(+0123456789,${DID})}" != "${DID}" | "${DID}" = ""]?Set(DID=${DEFAULT_DID}))
 same => n,GotoIf($["${DID}" = ""]?nodid)
 same => n,GoSub(sub-e164,s,1(${DID}))
 same => n,Set(DID=${GOSUB_RETVAL})
 same => n,GoSub(sub-e164,s,1(${CALLERID(num)}))
 same => n,Set(CALLERID(num)=${GOSUB_RETVAL})
 ; Inherited by the livekit leg; handy in CDRs and `core show channels`.
 same => n,Set(__CALLGO_DID=${DID})
 same => n,Set(CDR(userfield)=in:${DID})
 same => n,GoSub(sub-record,s,1(in-${DID}))
 ; b(): pre-dial handler on the livekit leg adds X-CallGo-* headers.
 same => n,Dial(PJSIP/${DID}@livekit,${INBOUND_RING_TIMEOUT},b(sub-livekit-headers^s^1(${DID})))
 ; Propagate the real failure (busy / unavailable) back to the carrier.
 same => n,Hangup(${HANGUPCAUSE})
 same => n(nodid),NoOp(No DID found and DEFAULT_DID empty)
 same => n,Hangup(1)

; INVITEs with an empty user part ("s") on single-DID trunks.
exten => s,1,Goto(from-carrier,${IF($["${DEFAULT_DID}" = ""]?invalid:${DEFAULT_DID})},1)

exten => invalid,1,Hangup(1)

; -----------------------------------------------------------------------------
; Outbound: LiveKit -> carrier / Гарах дуудлага
; livekit-sip INVITEs sip:<callee>@asterisk (CreateSIPParticipant on the
; number's outbound trunk; From user = our DID, used as caller ID). We format
; both numbers the way the carrier expects and dial out. The carrier's final
; status (486 busy, 480/408 no answer, 404...) is passed back verbatim so the
; CallGo dialer can classify busy / no_answer / failed.
; -----------------------------------------------------------------------------
[from-livekit]
; Echo test: `infra/scripts/sip-test-call.sh 9000` proves livekit-sip <->
; Asterisk media and DTMF without a carrier (you hear the agent's own voice).
exten => 9000,1,NoOp(CallGo echo test from LiveKit)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Echo()
 same => n,Hangup()

; Milliwatt tone test (1004 Hz) — checks the agent's audio input path.
exten => 9001,1,Answer()
 same => n,Milliwatt()
 same => n,Hangup()

exten => _[+0-9].,1,NoOp(CallGo outbound: to=${EXTEN} from=${CALLERID(num)})
 same => n,GoSub(sub-e164,s,1(${EXTEN}))
 same => n,Set(CALLEE=${GOSUB_RETVAL})
 same => n,GoSub(sub-carrier-format,s,1(${CALLEE}))
 same => n,Set(DIALNUM=${GOSUB_RETVAL})
 same => n,GoSub(sub-carrier-format,s,1(${CALLERID(num)}))
 same => n,Set(CALLERID(num)=${GOSUB_RETVAL})
 same => n,Set(CDR(userfield)=out:${CALLEE})
 same => n,GoSub(sub-record,s,1(out-${CALLEE}))
 same => n,Dial(PJSIP/${DIALNUM}@carrier,${OUTBOUND_RING_TIMEOUT})
 same => n,Hangup(${HANGUPCAUSE})

; -----------------------------------------------------------------------------
; Test softphone (pjsip_testphone.conf): any dialled number simulates a PSTN
; call to DEFAULT_DID. Туршилтын утаснаас орж ирэх дуудлагыг дуурайлгана.
; -----------------------------------------------------------------------------
[from-testphone]
exten => _[+0-9*#].,1,NoOp(CallGo test call from softphone -> ${DEFAULT_DID})
 same => n,GotoIf($["${DEFAULT_DID}" = ""]?nodid)
 same => n,Set(CALLERID(num)=+97699000000)
 same => n,Goto(from-carrier,${DEFAULT_DID},1)
 same => n(nodid),NoOp(CARRIER_DEFAULT_DID is empty: nothing to simulate)
 same => n,Hangup(1)

; =============================================================================
; Subroutines / Туслах дэд програмууд
; =============================================================================

; sub-e164(number): any Mongolian / international format -> E.164.
;   77001234 -> +97677001234   97677001234 -> +97677001234
;   0097677001234 -> +97677001234   +7... stays   unknown -> unchanged
[sub-e164]
exten => s,1,Set(LOCAL(N)=${FILTER(+0123456789,${ARG1})})
 same => n,GotoIf($["${N}" = ""]?done)
 same => n,GotoIf($["${N:0:1}" = "+"]?done)
 same => n,GotoIf($["${N:0:2}" = "00"]?intl)
 same => n,GotoIf($[${LEN(${N})} = ${NATIONAL_LEN}]?national)
 same => n,GotoIf($["${N:0:3}" = "${COUNTRY_CODE}"]?cc)
 same => n,Goto(done)
 same => n(intl),Set(LOCAL(N)=+${N:2})
 same => n,Goto(done)
 same => n(national),Set(LOCAL(N)=+${COUNTRY_CODE}${N})
 same => n,Goto(done)
 same => n(cc),Set(LOCAL(N)=+${N})
 same => n(done),Return(${N})

; sub-carrier-format(e164): E.164 -> the format in CARRIER_FORMAT.
[sub-carrier-format]
exten => s,1,Set(LOCAL(N)=${ARG1})
 same => n,GotoIf($["${CARRIER_FORMAT}" = "e164"]?done)
 same => n,Set(LOCAL(N)=${FILTER(0123456789,${N})})
 same => n,GotoIf($["${CARRIER_FORMAT}" = "intl"]?done)
 ; national: strip our country code, foreign numbers get the 00 prefix.
 same => n,Set(LOCAL(N)=${IF($["${N:0:3}" = "${COUNTRY_CODE}"]?${N:3}:00${N})})
 same => n(done),Return(${N})

; sub-record(tag): optional MixMonitor of the bridged audio.
[sub-record]
exten => s,1,GotoIf($["${RECORD_CALLS}" != "yes"]?skip)
 same => n,Set(LOCAL(F)=callgo-${ARG1}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}.wav)
 same => n,MixMonitor(${F},b)
 same => n,NoOp(Recording to /var/spool/asterisk/monitor/${F})
 same => n(skip),Return()

; sub-livekit-headers(did): runs on the outgoing livekit channel before the
; INVITE is sent. livekit-sip exposes custom headers to the room when the
; inbound trunk maps them (headers_to_attributes).
[sub-livekit-headers]
exten => s,1,Set(PJSIP_HEADER(add,X-CallGo-DID)=${ARG1})
 same => n,Set(PJSIP_HEADER(add,X-CallGo-Source)=asterisk)
 same => n,Return()
