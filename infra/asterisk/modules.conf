; =============================================================================
; CallGo.mn — Asterisk module loading / Модуль ачаалах тохиргоо
;
; autoload keeps the dependency graph of res_pjsip / chan_pjsip / codecs /
; app_dial / app_mixmonitor intact (a hand-written load list is fragile across
; Asterisk releases). We only switch off channel drivers and features CallGo
; never uses, which also closes ports that would otherwise be opened.
; (Шаардлагагүй сувгийн драйверуудыг унтраана.)
; =============================================================================
[modules]
autoload=yes

; Legacy / unused channel drivers (each would listen on its own port).
noload => chan_iax2.so
noload => chan_skinny.so
noload => chan_mgcp.so
noload => chan_unistim.so
noload => chan_ooh323.so
noload => chan_motif.so
noload => res_xmpp.so

; Alternative dialplan languages / distributed routing we don't use.
noload => pbx_ael.so
noload => pbx_lua.so
noload => pbx_dundi.so

; Phone provisioning, SNMP, LDAP, RADIUS — not used.
noload => res_phoneprov.so
noload => res_pjsip_phoneprov_provider.so
noload => res_snmp.so
noload => res_config_ldap.so
noload => cdr_radius.so
noload => cel_radius.so

; Realtime / CDR / CEL back-ends we don't configure (they log errors or try to
; reach a PostgreSQL / SQLite database at startup). CDRs go to cdr_csv.
noload => res_config_pgsql.so
noload => cdr_pgsql.so
noload => cel_pgsql.so
noload => cdr_sqlite3_custom.so
noload => cel_sqlite3_custom.so
noload => cdr_custom.so
noload => cel_custom.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so

; Sound-card channel drivers (no audio hardware in a container) and ADSI.
noload => chan_alsa.so
noload => chan_console.so
noload => chan_oss.so
noload => res_adsi.so
noload => app_adsiprog.so
noload => app_getcpeid.so
; Ogg/Vorbis file format (library not present in the image; WAV is used).
noload => format_ogg_vorbis.so
