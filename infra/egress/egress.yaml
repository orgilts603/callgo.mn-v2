# =============================================================================
# CallGo.mn — LiveKit Egress (call recording) configuration
# Дуудлага бичлэг хийх (egress) үйлчилгээний тохиргоо
#
# Enabled only with the compose profile "recording":
#   docker compose --profile full --profile recording up -d
#
# api_key / api_secret / ws_url come from LIVEKIT_API_KEY, LIVEKIT_API_SECRET,
# LIVEKIT_WS_URL (set by docker compose from .env).
#
# How a recording reaches the CRM (Бичлэг CRM-д хэрхэн хүрэх вэ):
#   1. On call.answered the backend (internal/recording) calls
#      StartRoomCompositeEgress{audio_only, file_outputs:[OGG]} for the call
#      room when the org has the "recordings" feature and recordCalls != false.
#   2. Object key: recordings/<orgId>/<yyyy>/<mm>/<callId>.ogg
#        CALLGO_RECORDINGS_DRIVER=s3    -> the request carries the S3 target
#          (S3_EGRESS_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY,
#          S3_REGION, force_path_style) — no storage section needed here;
#        CALLGO_RECORDINGS_DRIVER=local -> /out/recordings/<key> on the shared
#          `recordings` volume (backend reads it at CALLGO_RECORDINGS_DIR).
#   3. When the room ends (or the backend stops the egress on call.ended),
#      livekit-server sends `egress_ended` to POST /api/livekit/webhook and
#      the backend marks Call.recording ready (size, duration);
#      Call.recordingUrl = /api/calls/{id}/recording, which 302-redirects to a
#      10-minute signed URL (presigned S3 GET or HMAC-signed local link).
#   4. Nightly retention deletes objects older than
#      org.settings.recordingRetentionDays (default
#      CALLGO_RECORDING_RETENTION_DAYS=90).
#
# Do not combine backend recordings (CALLGO_RECORDINGS=true) with the
# dispatch-rule auto egress of lk-setup.sh (room_config.egress): every call
# would be recorded twice.
# =============================================================================

redis:
  address: redis:6379

# HTTP health check port (compose healthcheck) and metrics.
health_port: 8082
prometheus_port: 6792

logging:
  level: info

# Internal ws:// connection to livekit-server on the private Docker network.
insecure: true

# Hard cap per recording so a stuck call cannot fill the disk.
session_limits:
  file_output_max_duration: 2h

# ---------------------------------------------------------------------------
# Default storage for egresses started WITHOUT an explicit output target
# (only the lk-setup auto egress; backend requests always carry their own S3
# target or /out path). Without it, files are written inside the container
# at the requested path (/out/... is the shared `recordings` volume).
# Credentials may come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY /
# AWS_REGION, which docker-compose sets from S3_ACCESS_KEY / S3_SECRET_KEY /
# S3_REGION. The MinIO of the compose stack:
# ---------------------------------------------------------------------------
# storage:
#   s3:
#     access_key: ""
#     secret: ""
#     region: us-east-1
#     endpoint: http://minio:9000       # MinIO / R2 / other S3-compatible
#     bucket: callgo-recordings
#     force_path_style: true
