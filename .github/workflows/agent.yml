name: agent

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
      - "docs/**"
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
      - "docs/**"

concurrency:
  group: agent-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agent/pyproject.toml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Ruff
        run: .venv/bin/ruff check callgo_agent tests

      - name: Pytest
        run: .venv/bin/pytest -q
