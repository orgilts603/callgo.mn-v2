name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "!frontend/e2e/**"
      - ".github/workflows/frontend.yml"
      - "docs/**"
  pull_request:
    paths:
      - "frontend/**"
      - "!frontend/e2e/**"
      - ".github/workflows/frontend.yml"
      - "docs/**"

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: tsc + vitest + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit -p tsconfig.app.json

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build
