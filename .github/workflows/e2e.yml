name: e2e

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/e2e.yml"
      - "docs/**"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/e2e.yml"
      - "docs/**"

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: callgo
          POSTGRES_PASSWORD: callgo
          POSTGRES_DB: callgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callgo -d callgo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_BASE_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            frontend/e2e/package-lock.json

      - name: Enable the pgvector extension
        run: |
          PGPASSWORD=callgo psql -h localhost -U callgo -d callgo -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector'

      - name: Build the backend
        working-directory: backend
        run: go build -o "$RUNNER_TEMP/callgo-server" ./cmd/server

      - name: Start the backend (mock telephony + call simulator)
        env:
          CALLGO_DATABASE_URL: postgres://callgo:callgo@localhost:5432/callgo?sslmode=disable
          CALLGO_HTTP_ADDR: 127.0.0.1:8080
          CALLGO_MOCK_TELEPHONY: "true"
          CALLGO_SIMULATOR: "true"
          CALLGO_SIMULATOR_INTERVAL: 2s
          CALLGO_EMBED_FAKE: "true"
          CALLGO_LOG_PRETTY: "false"
        run: |
          nohup "$RUNNER_TEMP/callgo-server" > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 1
          done
          echo "backend did not become healthy" >&2
          cat "$RUNNER_TEMP/backend.log" >&2
          exit 1

      - name: Build and serve the frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          # vite preview reuses server.proxy, so /api and /ws reach the backend on :8080.
          nohup pnpm exec vite preview --host 127.0.0.1 --port 5173 --strictPort \
            > "$RUNNER_TEMP/frontend.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5173/ >/dev/null && exit 0
            sleep 1
          done
          echo "frontend did not start" >&2
          cat "$RUNNER_TEMP/frontend.log" >&2
          exit 1

      - name: Install Playwright and Chromium
        working-directory: frontend/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the smoke tests
        working-directory: frontend/e2e
        run: npx playwright test -c ../playwright.config.ts

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report
            frontend/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: |
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/frontend.log
          retention-days: 7
          if-no-files-found: ignore
