[project]
name = "callgo-agent"
version = "0.1.0"
description = "CallGo.mn Voice AI agent worker built on LiveKit Agents"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[silero,openai,anthropic,google,groq,turn-detector]~=1.8.3",
    "livekit-api",
    "faster-whisper>=1.1.0",
    "piper-tts>=1.2.0",
    "numpy",
    "httpx",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv",
    "aiohttp",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "respx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["callgo_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
