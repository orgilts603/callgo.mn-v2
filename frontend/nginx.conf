# =============================================================================
# CallGo.mn frontend nginx — installed as /etc/nginx/conf.d/default.conf
# (i.e. inside the http {} block of the stock nginx.conf).
#
#  /            React SPA (dist/), history-API fallback to index.html
#  /api/ws      WebSocket to the backend (Live Desk events), upgrade headers
#  /api/        REST API proxy to backend:8080
#  /recordings/ LiveKit egress local recordings (shared `recordings` volume)
#  /internal/   blocked: the agent-only API must never be reachable publicly
#
# TLS terminates in front of this container (Caddy on the host, see
# infra/caddy/Caddyfile); X-Forwarded-Proto from that proxy is passed on.
# =============================================================================

# WebSocket upgrade: "upgrade" when the client asks for it, else keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Preserve the scheme set by an outer TLS proxy (Caddy), else use ours.
map $http_x_forwarded_proto $callgo_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CSV uploads (contacts / campaign targets).
    client_max_body_size 25m;

    # Docker's embedded DNS: resolve `backend` per request (with a short TTL)
    # so a restarted backend container with a new IP is picked up without
    # reloading nginx, and nginx starts even if the backend is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $callgo_backend http://backend:8080;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers (inherited by every location without its own add_header).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Container healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Live events WebSocket. The JWT travels as ?token=, so keep it out of
    # the access log.
    location = /api/ws {
        access_log off;
        proxy_pass $callgo_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $callgo_forwarded_proto;
        proxy_buffering off;
        # Long-lived connection; the client pings periodically.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # REST API (also serves the LiveKit webhook path for completeness; LiveKit
    # itself posts to backend:8080 directly on the Docker network).
    location /api/ {
        proxy_pass $callgo_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $callgo_forwarded_proto;
        # LLM test calls proxied to the agent may take up to ~30 s.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Agent worker internal API (X-Agent-Token) — never exposed.
    location /internal/ {
        return 404;
    }

    # Call recordings written by LiveKit egress to /out/recordings/ (shared
    # volume mounted at /srv/callgo-out). The backend turns the egress
    # location "/out/recordings/<file>" into "/recordings/<file>".
    location /recordings/ {
        alias /srv/callgo-out/recordings/;
        autoindex off;
        types {
            audio/ogg  ogg oga opus;
            audio/mp4  m4a mp4;
            audio/mpeg mp3;
            audio/wav  wav;
        }
    }

    # Vite's content-hashed bundles: cache forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: unknown paths render index.html; never cache the HTML shell.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
